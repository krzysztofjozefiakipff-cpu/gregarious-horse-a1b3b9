name: CARVAMO preview HTTPS deploy
on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "panel/**"
      - "assets/brand/**"
      - "infra/preview/**"
      - "tools/ovh/deploy_preview.sh"
      - ".github/workflows/carvamo-preview-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carvamo-preview-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: ovh-staging
    steps:
      - uses: actions/checkout@v4
      - name: Check preview files
        run: |
          set -euo pipefail
          test -s preview/index.html
          grep -q 'CARVAMO PREVIEW' preview/index.html
          test -s infra/preview/Caddyfile
          test -s preview/assets/carvamo-wordmark.svg
          test -s preview/assets/carvamo-favicon.svg
          test -s preview/live-catalog.js
          node --check preview/live-catalog.js || true
          grep -q "carvamoLoadLiveOffers" preview/index.html
          grep -q "loadPublishedOffers" preview/index.html
          test -s preview/offer-detail.js
          test -s preview/offer-detail.css
          test -s preview/leads-admin.html
          node --check preview/offer-detail.js
          node --check preview/leads-admin.js
          bash -n tools/ovh/deploy_preview.sh
          mkdir -p preview/panel preview/assets/brand
          rsync -a --ignore-existing panel/ preview/panel/
          cp -a assets/brand/. preview/assets/brand/
          test -s preview/panel/index.html
          test -s preview/panel/app.js
          grep -q 'CARVAMO' preview/panel/index.html
          ! grep -qi 'carvelo' preview/panel/index.html
          test -s preview/panel/photos.js
          test -s preview/assets/brand/carvelo-wordmark-on-dark.svg
          tar -czf "/tmp/carvamo-preview-${GITHUB_SHA}.tgz" -C preview .
      - name: Configure pinned SSH host
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/carvamo_deploy
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/carvamo_deploy ~/.ssh/known_hosts
      - name: Upload isolated preview release
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=10)
          SCP=(scp -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          HOST=carvamo-deploy@146.59.52.16
          "${SSH[@]}" "$HOST" 'mkdir -p "$HOME/carvamo-preview"'
          "${SCP[@]}" "/tmp/carvamo-preview-${GITHUB_SHA}.tgz" "$HOST:carvamo-preview/upload-${GITHUB_SHA}.tgz"
          "${SCP[@]}" infra/preview/Caddyfile "$HOST:carvamo-preview/config-${GITHUB_SHA}.Caddyfile"
          "${SCP[@]}" tools/ovh/deploy_preview.sh "$HOST:carvamo-preview/deploy-${GITHUB_SHA}.sh"
      - name: Start preview and verify HTTPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes carvamo-deploy@146.59.52.16 "bash carvamo-preview/deploy-${GITHUB_SHA}.sh ${GITHUB_SHA}"
      - name: Verify branded assets and catalog module over HTTPS
        run: |
          set -euo pipefail
          for path in /assets/carvamo-wordmark.svg /assets/carvamo-favicon.svg /live-catalog.js /offer-detail.js /offer-detail.css /leads-admin.html /panel/config.js /panel/ /panel/app.js /panel/photos.js /assets/brand/carvelo-wordmark-on-dark.svg; do
            echo "Checking $path"
            curl --fail --silent --show-error --max-time 15 "https://preview.carvamo.com$path" -o /dev/null
          done
          curl --fail --silent --show-error --max-time 15 https://preview.carvamo.com/ -o /tmp/carvamo-home-check.html
          grep -q "carvamo-wordmark.svg" /tmp/carvamo-home-check.html
          curl --fail --silent --show-error --max-time 15 "https://preview.carvamo.com/panel/?check=${GITHUB_SHA}" -o /tmp/carvamo-panel-check.html
          grep -q "Panel CARVAMO" /tmp/carvamo-panel-check.html
          ! grep -qi "carvelo" /tmp/carvamo-panel-check.html
          curl --fail --silent --show-error --max-time 15 "https://preview.carvamo.com/panel/config.js?check=${GITHUB_SHA}" -o /tmp/carvamo-panel-config.js
          grep -q "https://rgnqsrllgemsyumvjwax.supabase.co" /tmp/carvamo-panel-config.js
          echo "Verified: live CARVAMO panel branding and Supabase config"
          echo "CARVAMO preview branded assets and catalog module reachable"
