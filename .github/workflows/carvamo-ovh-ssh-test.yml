name: CARVAMO OVH SSH connection test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secret
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
        run: |
          test -n "$OVH_SSH_PRIVATE_KEY" || { echo "Missing OVH_SSH_PRIVATE_KEY"; exit 1; }
      - name: Verify server host key and SSH identity
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_HOST_KEY" || { echo "Missing OVH_SSH_HOST_KEY: pin the verified server public host key before running"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/carvamo_deploy
          chmod 600 ~/.ssh/carvamo_deploy
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes carvamo-deploy@146.59.52.16 'test "$(id -un)" = carvamo-deploy && echo "OVH SSH: OK"'
