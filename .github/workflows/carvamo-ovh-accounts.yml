name: CARVAMO OVH private accounts API
on:
  push:
    branches: [main]
    paths:
      - "services/accounts/**"
      - "tools/ovh/deploy_accounts_staging.sh"
      - "tools/ovh/activate_first_admin.sh"
      - ".github/workflows/carvamo-ovh-accounts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carvamo-ovh-staging-accounts
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: ovh-staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and shell
        run: |
          python -m py_compile services/accounts/app.py services/accounts/public_leads.py
          bash -n tools/ovh/deploy_accounts_staging.sh
          bash -n tools/ovh/activate_first_admin.sh
      - name: Configure SSH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_PRIVATE_KEY" && test -n "$OVH_SSH_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/carvamo_deploy
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/carvamo_deploy ~/.ssh/known_hosts
      - name: Stage isolated service and deploy
        env:
          RESET_SMTP_PASSWORD: ${{ secrets.RESET_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          SCP="scp -i $HOME/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          $SSH carvamo-deploy@146.59.52.16 'install -d -m 700 ~/carvamo-backend/accounts-src'
          $SCP services/accounts/app.py services/accounts/public_leads.py services/accounts/requirements.txt services/accounts/Dockerfile carvamo-deploy@146.59.52.16:carvamo-backend/accounts-src/
          $SCP tools/ovh/deploy_accounts_staging.sh carvamo-deploy@146.59.52.16:carvamo-backend/deploy_accounts_staging.sh
          $SCP tools/ovh/activate_first_admin.sh carvamo-deploy@146.59.52.16:carvamo-backend/activate_first_admin.sh
          if [[ -n "$RESET_SMTP_PASSWORD" ]]; then
            if [[ "$RESET_SMTP_PASSWORD" == *$'\n'* || "$RESET_SMTP_PASSWORD" == *$'\r'* ]]; then
              echo "RESET_SMTP_PASSWORD must be a single line" >&2
              exit 1
            fi
            printf 'RESET_SMTP_HOST=smtp.mail.ovh.net\nRESET_SMTP_USER=admin@carvamo.com\nRESET_SMTP_PASSWORD=%s\n' "$RESET_SMTP_PASSWORD" |
              $SSH carvamo-deploy@146.59.52.16 'set -eu; umask 077; dir="$HOME/carvamo-backend"; tmp=$(mktemp "$dir/accounts-mail.XXXXXX"); trap '\''rm -f "$tmp"'\'' EXIT; cat > "$tmp"; mv "$tmp" "$dir/accounts-mail.env"'
          else
            echo "::notice::RESET_SMTP_PASSWORD is not configured in GitHub Actions."
          fi
          $SSH carvamo-deploy@146.59.52.16 'bash ~/carvamo-backend/deploy_accounts_staging.sh'
      - name: Verify OVH deployed source matches this GitHub commit
        run: |
          set -euo pipefail
          expected=$(sha256sum services/accounts/app.py | awk '{print $1}')
          actual=$(ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            carvamo-deploy@146.59.52.16 \
            'docker exec carvamo-accounts-staging sha256sum /app/app.py' | awk '{print $1}')
          test "$expected" = "$actual" || { echo 'OVH running app.py differs from GitHub commit' >&2; exit 1; }
          echo "OVH running app.py matches GitHub commit $GITHUB_SHA"
      - name: Verify deployed PDF importer route and authentication
        run: |
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            carvamo-deploy@146.59.52.16 'docker exec -i carvamo-accounts-staging python -' <<'PY'
          from app import app
          routes = {(rule.rule, method) for rule in app.url_map.iter_rules() for method in rule.methods}
          assert ('/api/offers/import-specification', 'POST') in routes, 'PDF importer route missing'
          assert ('/api/public/offers', 'GET') in routes, 'Public catalog route missing'
          assert ('/api/public/leads', 'POST') in routes, 'Public lead intake route missing'
          with app.test_client() as client:
              response = client.post('/api/offers/import-specification')
              assert response.status_code in (401, 403), f'Unexpected response: {response.status_code}'
          print('OVH importer route deployed and authentication enforced; PDF extraction not tested')
          PY
      - name: Verify public lead API and PostgreSQL on OVH
        run: |
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            carvamo-deploy@146.59.52.16 'docker exec -i carvamo-accounts-staging python -' <<'PY'
          from uuid import UUID
          from app import app, conn
          with app.test_client() as client:
              invalid = client.post('/api/public/leads', json={'consent': False})
              assert invalid.status_code == 400, f'Validation failed: {invalid.status_code}'
              with conn() as db:
                  row = db.execute(
                      "SELECT o.id FROM offers o JOIN dealers d ON d.id=o.dealer_id "
                      "WHERE o.status='published' AND o.deletion_pending=false AND d.active=true LIMIT 1"
                  ).fetchone()
              if not row:
                  print('BLOCKED: no published offer from an active dealer; end-to-end lead test not possible')
                  raise SystemExit(2)
              payload = {'offer_id': str(row['id']), 'full_name': 'CARVAMO Test',
                         'email': 'carvamo-test@example.invalid', 'phone': '500000000',
                         'message': 'Automated staging verification; synthetic data', 'consent': True}
              response = client.post('/api/public/leads', json=payload,
                                     headers={'Origin': 'https://preview.carvamo.com'})
              assert response.status_code == 201, f'Lead creation failed: {response.status_code}: {response.get_json()}'
              reference = response.get_json()['reference']
              UUID(reference)
              with conn() as db:
                  lead = db.execute('SELECT id,offer_id,email,status FROM leads WHERE id=%s', (reference,)).fetchone()
                  assert lead and str(lead['offer_id']) == str(row['id']) and lead['email'] == payload['email'] and lead['status'] == 'new', 'Lead not persisted correctly'
              print('PASS: OVH lead endpoint inserted and PostgreSQL returned the expected record:', reference)
              print('NOTICE: synthetic staging lead retained for panel visibility verification')
          PY
      - name: Check SMTP connectivity from OVH
        run: |
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            carvamo-deploy@146.59.52.16 'docker exec -i carvamo-accounts-staging python -' <<'PY'
          import os
          import smtplib
          import ssl

          host = os.getenv("RESET_SMTP_HOST")
          user = os.getenv("RESET_SMTP_USER")
          password = os.getenv("RESET_SMTP_PASSWORD")
          if not all((host, user, password)):
              print("SMTP not configured")
              raise SystemExit(0)
          try:
              with smtplib.SMTP_SSL(host, 465, timeout=8, context=ssl.create_default_context()) as smtp:
                  smtp.login(user, password)
          except smtplib.SMTPResponseException as error:
              print(f"SMTP verification failed: {type(error).__name__}, status {error.smtp_code}")
              raise SystemExit(1)
          except (OSError, smtplib.SMTPException) as error:
              print(f"SMTP verification failed: {type(error).__name__}")
              raise SystemExit(1)
          print("SMTP authentication succeeded")
          PY
