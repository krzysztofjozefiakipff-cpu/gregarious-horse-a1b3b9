name: Bieg Wyżej iOS TestFlight
on:
  push:
    branches: [lejek/ios-build-check]
    paths: [.github/workflows/lejek-ios-build-check.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the iOS pilot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bieg-wyzej/www"
          cd "$RUNNER_TEMP/bieg-wyzej"
          printf '%s\n' '{"name":"bieg-wyzej-test","version":"0.1.0","private":true}' > package.json
          printf '%s\n' '{"appId":"pl.biegwyzej.pilot","appName":"Bieg Wyżej Test","webDir":"www","server":{"url":"https://lejek.carvamo.com/","appStartPath":"login"}}' > capacitor.config.json
          printf '%s\n' '<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Bieg Wyżej Test</title></head><body><p>Połącz się z internetem i uruchom Bieg Wyżej ponownie.</p></body></html>' > www/index.html
          cp www/index.html www/login
          npm install --save-exact @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/ios@8.6.2
          npx cap add ios
          iconset=ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp "$GITHUB_WORKSPACE/services/lejek/ios/AppIcon.png" "$iconset/AppIcon.png"
          node --input-type=module - "$iconset/Contents.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file=process.argv[2];
          const catalog=JSON.parse(readFileSync(file,'utf8'));
          catalog.images=[{filename:'AppIcon.png',idiom:'universal',platform:'ios',size:'1024x1024'}];
          writeFileSync(file,JSON.stringify(catalog,null,2)+'\n');
          JS
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string Mikrofon służy do nagrywania pytań głosowych do asystenta Lisek.' ios/App/App/Info.plist
      - name: Sign and upload to internal TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}" "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}" "${ASC_KEY_ID:?Missing ASC_KEY_ID}" "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY}"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ && "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ && "$ASC_ISSUER_ID" =~ ^[a-fA-F0-9-]{36}$ ]]
          cd "$RUNNER_TEMP/bieg-wyzej"
          umask 077
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          unset ASC_PRIVATE_KEY
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          openssl req -new -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/ios-signing.key" \
            -out "$RUNNER_TEMP/ios-signing.csr" -subj '/CN=Bieg Wyzej TestFlight'
          SIGNING_KEY_PATH="$key" node --input-type=module <<'JS'
          import {createSign} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const {ASC_KEY_ID:kid,ASC_ISSUER_ID:iss,RUNNER_TEMP:tmp,SIGNING_KEY_PATH:key}=process.env;
          const encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');
          const iat=Math.floor(Date.now()/1000);
          const claim=encode({alg:'ES256',kid,typ:'JWT'})+'.'+encode({iss,iat,exp:iat+600,aud:'appstoreconnect-v1'});
          const signature=createSign('SHA256').update(claim).sign({key:readFileSync(key),dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token=claim+'.'+signature;
          async function request(path,data){
            const response=await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{
              method:data?'POST':'GET',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:data?JSON.stringify({data}):undefined
            });
            const json=await response.json();
            if(!response.ok) throw Error(path+': '+response.status+' '+json.errors?.map(e=>e.code+' '+e.detail).join('; '));
            return json;
          }
          const api=async(path,data)=>(await request(path,data)).data;
          async function listAll(path) {
            const results=[];
            while (path) {
              const page=await request(path);
              results.push(...page.data);
              const next=page.links?.next;
              if (!next) return results;
              const url=new URL(next);
              if (url.origin!=='https://api.appstoreconnect.apple.com'||!url.pathname.startsWith('/v1/'))
                throw Error('Unexpected Apple API pagination URL');
              path=url.pathname.slice(4)+url.search;
            }
            return results;
          }
          const id='pl.biegwyzej.pilot';
          const bundles=await api('bundleIds?'+new URLSearchParams({'filter[identifier]':id}));
          const bundle=bundles.find(b=>b.attributes.identifier===id);
          if(!bundle) throw Error('Bundle ID is missing from the Apple team: '+id);
          const apps=await api('apps?'+new URLSearchParams({'filter[bundleId]':id}));
          if(apps.length!==1) throw Error('App Store Connect must have one app record for '+id);
          const push=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          if (push.head_commit?.message==='Lejek: rotate the approved Bieg Wyzej TestFlight certificate') {
            const previousCertificate='2GL94HV987';
            const previousProfile='JZCQ4X2BG6';
            const current=await api('certificates?filter%5BcertificateType%5D=IOS_DISTRIBUTION,DISTRIBUTION&limit=200');
            const target=current.find(certificate=>certificate.id===previousCertificate);
            if (target) {
              if (target.attributes.certificateType!=='IOS_DISTRIBUTION')
                throw Error('Unexpected certificate type. No certificate was revoked.');
              const profile=await api('profiles/'+previousProfile+'?include=bundleId');
              const originalProfile=profile.attributes;
              if (originalProfile.profileType!=='IOS_APP_STORE'||
                  !originalProfile.name.startsWith('Bieg Wyzej TestFlight ')||
                  profile.relationships.bundleId.data.id!==bundle.id)
                throw Error('The expected Bieg Wyzej TestFlight profile does not match. No certificate was revoked.');
              const profiles=await listAll('profiles?limit=200');
              const relatedProfiles=[];
              for (const {id:profileId} of profiles) {
                const certificates=await listAll('profiles/'+profileId+'/certificates?limit=200');
                if (certificates.some(certificate=>certificate.id===previousCertificate))
                  relatedProfiles.push(profileId);
              }
              if (relatedProfiles.length!==1||relatedProfiles[0]!==previousProfile)
                throw Error('The certificate is not exclusive to the expected Bieg Wyzej profile. No certificate was revoked.');
              const revoke=await fetch('https://api.appstoreconnect.apple.com/v1/certificates/'+previousCertificate,{
                method:'DELETE',headers:{Authorization:'Bearer '+token}
              });
              if (revoke.status!==204&&revoke.status!==404)
                throw Error('Revoking the approved TestFlight certificate returned '+revoke.status);
              console.log('Verified exclusive TestFlight profile and retired its previous certificate.');
            }
          }
          const cert=await api('certificates',{type:'certificates',attributes:{
            certificateType:'IOS_DISTRIBUTION',csrContent:readFileSync(join(tmp,'ios-signing.csr'),'utf8')
          }});
          console.log('Distribution certificate created:',cert.id);
          writeFileSync(join(tmp,'ios-signing.cer'),Buffer.from(cert.attributes.certificateContent,'base64'));
          const profile=await api('profiles',{type:'profiles',attributes:{
            profileType:'IOS_APP_STORE',name:'Bieg Wyzej TestFlight '+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT
          },relationships:{bundleId:{data:{type:'bundleIds',id:bundle.id}},certificates:{data:[{type:'certificates',id:cert.id}]}}});
          console.log('App Store distribution profile created:',profile.id);
          writeFileSync(join(tmp,'ios-signing.mobileprovision'),Buffer.from(profile.attributes.profileContent,'base64'));
          JS
          openssl x509 -inform DER -in "$RUNNER_TEMP/ios-signing.cer" -out "$RUNNER_TEMP/ios-signing.pem"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          chain="$RUNNER_TEMP/ios-signing.keychain-db"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/ios-signing.key" -in "$RUNNER_TEMP/ios-signing.pem" \
            -out "$RUNNER_TEMP/ios-signing.p12" -passout "pass:$pass" -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES
          security create-keychain -p "$pass" "$chain"
          security set-keychain-settings -lut 3600 "$chain"
          security unlock-keychain -p "$pass" "$chain"
          security list-keychains -d user -s "$chain" login.keychain-db
          security import "$RUNNER_TEMP/ios-signing.p12" -k "$chain" -P "$pass" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$chain" >/dev/null
          security cms -D -i "$RUNNER_TEMP/ios-signing.mobileprovision" > "$RUNNER_TEMP/ios-signing.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/ios-signing.plist")
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$RUNNER_TEMP/ios-signing.mobileprovision" "$profiles/$uuid.mobileprovision"
          identity=$(openssl x509 -in "$RUNNER_TEMP/ios-signing.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          sed -i '' -e "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = $uuid; CODE_SIGN_IDENTITY = $identity;/" \
            ios/App/App.xcodeproj/project.pbxproj
          archive="$RUNNER_TEMP/BiegWyzej.xcarchive"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive
          test -s "$archive/Products/Applications/App.app/public/login"
          app="$archive/Products/Applications/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")" = AppIcon
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist")"
          echo "Verified startup file, native icon and microphone permission in the signed archive."
          export_options="$RUNNER_TEMP/BiegWyzejExport.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate -string "$identity" "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert provisioningProfiles -json "{\"pl.biegwyzej.pilot\":\"$uuid\"}" "$export_options"
          plutil -insert testFlightInternalTestingOnly -bool YES "$export_options"
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/BiegWyzejExport" "${auth[@]}"
