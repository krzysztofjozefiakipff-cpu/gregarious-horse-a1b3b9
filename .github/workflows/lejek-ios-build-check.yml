name: Bieg Wyżej iOS TestFlight
on:
  push:
    branches: [lejek/verify-ios-favicon]
    paths: [.github/workflows/lejek-ios-build-check.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the iOS pilot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bieg-wyzej/www"
          cd "$RUNNER_TEMP/bieg-wyzej"
          printf '%s\n' '{"name":"bieg-wyzej-test","version":"0.1.0","private":true}' > package.json
          printf '%s\n' '{"appId":"pl.biegwyzej.pilot","appName":"Bieg Wyżej Test","webDir":"www","server":{"url":"https://lejek.carvamo.com/","appStartPath":"login"}}' > capacitor.config.json
          printf '%s\n' '<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Bieg Wyżej Test</title></head><body><p>Połącz się z internetem i uruchom Bieg Wyżej ponownie.</p></body></html>' > www/index.html
          cp www/index.html www/login
          npm install --save-exact @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/ios@8.6.2
          npx cap add ios
          iconset=ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp "$GITHUB_WORKSPACE/services/lejek/ios/AppIcon.png" "$iconset/AppIcon.png"
          node --input-type=module - "$iconset/Contents.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file=process.argv[2];
          const catalog=JSON.parse(readFileSync(file,'utf8'));
          catalog.images=[{filename:'AppIcon.png',idiom:'universal',platform:'ios',size:'1024x1024'}];
          writeFileSync(file,JSON.stringify(catalog,null,2)+'\n');
          JS
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' ios/App/App/Info.plist
      - name: Build and verify the native icon
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bieg-wyzej"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/bieg-simulator" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/bieg-simulator/Build/Products/Debug-iphonesimulator/App.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" | grep -Fx AppIcon
          test -s "$app/Assets.car"
