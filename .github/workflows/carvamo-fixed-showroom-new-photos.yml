name: CARVAMO fixed showroom BRIA cutout QA
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/carvamo-fixed-showroom-new-photos.yml
      - tools/carvamo-photo-ai/fixed_showroom_composite.py
      - tools/carvamo-photo-ai/bria_remove_background.py
permissions:
  contents: read
  actions: read
jobs:
  fixed-showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: carvamo-fixed-showroom-bria
      cancel-in-progress: false
    env:
      BRIA_API_TOKEN: ${{ secrets.BRIA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing
        run: python3 -m pip install --user pillow
      - name: Validate and unpack originals
        run: |
          set -euo pipefail
          mkdir -p fixed_qa
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path('photo-ai-test-input/carvamo_pakiet_testowy_10_zdjec.zip')
          with ZipFile(p) as z:
            names=z.namelist()
            if any(n.startswith('/') or '..' in Path(n).parts for n in names):raise ValueError('Unsafe ZIP entry')
            z.extractall('fixed_qa')
          PY
          cp photo-ai-preview/a_clean_modern_showroom_style_background_for_ai_c.png fixed_qa/showroom.png
      # Reuse BRIA alpha cutouts across compositor changes. The cache key is
      # based on source photos and BRIA client, NOT compositor code.
      - name: Restore BRIA cutout cache
        id: cutout-cache
        uses: actions/cache/restore@v4
        with:
          path: fixed_qa/*-cutout.png
          key: carvamo-bria-cutouts-v2-${{ hashFiles('photo-ai-test-input/carvamo_pakiet_testowy_10_zdjec.zip', 'tools/carvamo-photo-ai/bria_remove_background.py') }}
      - name: Seed cutouts from previously successful run
        if: steps.cutout-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: carvamo-fixed-showroom-new-photos
          run-id: 44203246755
          github-token: ${{ github.token }}
          path: fixed_qa/seed
      - name: Recover seeded transparent vehicles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('fixed_qa')
          for base in ('IMG_9322','IMG_9321','IMG_9319','IMG_9318','IMG_9315','IMG_9314','IMG_9313'):
              dest=root/f'{base}-cutout.png'
              if dest.exists():continue
              for candidate in root.glob(f'seed/**/{base}-cutout.png'):
                  try:
                      with Image.open(candidate) as img:
                          if img.mode not in ('RGBA','LA') or img.getchannel('A').getextrema()[0]>=250:
                              continue
                          img.verify()
                      dest.write_bytes(candidate.read_bytes())
                      print('Reused',base)
                      break
                  except Exception as exc:
                      print('Invalid seed',candidate,exc)
          PY
      - name: Remove backgrounds and composite on approved reference
        run: |
          set -uo pipefail
          count=0
          failures=0
          : > fixed_qa/status.txt
          for pair in "IMG_9322.jpeg:left:side" "IMG_9321.jpeg:rear:straight" "IMG_9319.jpeg:front:straight" "IMG_9318.jpeg:front:three_quarter" "IMG_9315.jpeg:rear:three_quarter" "IMG_9314.jpeg:front:three_quarter" "IMG_9313.jpeg:front:three_quarter"; do
            file="${pair%%:*}"; angle="${pair##*:}"; view="${pair#*:}"; view="${view%%:*}"; base="${file%.jpeg}"
            echo "Processing $base ($view)"
            if { test -s "fixed_qa/$base-cutout.png" || python3 tools/carvamo-photo-ai/bria_remove_background.py --image-file "fixed_qa/input/$file" --output "fixed_qa/$base-cutout.png"; } && python3 tools/carvamo-photo-ai/fixed_showroom_composite.py --vehicle "fixed_qa/$base-cutout.png" --background fixed_qa/showroom.png --view "$view" --camera-angle "$angle" --car-width .60 --floor-y .77 --floor-reflection water_mirror --output-dir "fixed_qa/$base-final"; then
              echo "$base SUCCESS" >> fixed_qa/status.txt
              count=$((count+1))
            else
              echo "$base FAILED" >> fixed_qa/status.txt
              failures=$((failures+1))
            fi
          done
          echo "SUCCESS=$count FAILED=$failures" | tee -a fixed_qa/status.txt
          test "$count" -eq 7 && test "$failures" -eq 0
      - name: Persist reusable BRIA cutouts
        if: always() && steps.cutout-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fixed_qa/*-cutout.png
          key: carvamo-bria-cutouts-v2-${{ hashFiles('photo-ai-test-input/carvamo_pakiet_testowy_10_zdjec.zip', 'tools/carvamo-photo-ai/bria_remove_background.py') }}
      - name: Save private results for visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carvamo-fixed-showroom-new-photos
          path: fixed_qa/
          retention-days: 7
          if-no-files-found: warn
