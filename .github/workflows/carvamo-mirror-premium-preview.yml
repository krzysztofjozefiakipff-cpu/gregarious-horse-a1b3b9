name: CARVAMO Mirror Premium OVH preview
# Brand Book 2.0 marine/navy palette render QA; official logo still required for final branding.
on:
  push:
    branches: [main]
    paths: [.github/workflows/carvamo-mirror-premium-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carvamo-mirror-premium-preview
  cancel-in-progress: false
jobs:
  render-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$KNOWN"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Render isolated premium showroom on OVH
        env:
          HOST: ${{ secrets.OVH_DEPLOY_HOST }}
          USER: ${{ secrets.OVH_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p preview
          REMOTE="$USER@$HOST"
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          SCP="scp -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          # Only /tmp; no app deployment, no Supabase, no paid API.
          $SSH "$REMOTE" 'mkdir -p /tmp/carvamo-mirror-premium-preview'
          $SCP tools/carvelo-photo-ai/build_showroom_3d.py "$REMOTE:/tmp/carvamo-mirror-premium-preview/build_showroom_3d.py"
          $SCP tools/carvelo-photo-ai/mirror_poc_v53.py "$REMOTE:/tmp/carvamo-mirror-premium-preview/mirror_poc_v53.py"
          # Search only known local canonical logo locations; never substitute a generated logo.
          $SSH "$REMOTE" 'set -eu
            BASE=/tmp/carvamo-mirror-premium-preview
            LOGO=""
            for p in /opt/carvamo/app/public/carvamo_official_logo.png /opt/carvamo/app/public/brand/carvamo_official_logo.png /opt/carvamo/app/public/brand/carvamo-logo.png /tmp/carvamo-photo-ai-test/carvamo_official_logo.png; do
              if test -s "$p"; then LOGO="$p"; break; fi
            done
            if test -n "$LOGO"; then
              blender -b -t 2 --python "$BASE/build_showroom_3d.py" -- --output-dir "$BASE/render" --logo-png "$LOGO" --studio-style mirror-premium --step 90 --samples 8 --width 1280 --height 720
            else
              echo "OFFICIAL_LOGO_NOT_ON_OVH: scene remains unbranded, no substitution" >&2
              blender -b -t 2 --python "$BASE/build_showroom_3d.py" -- --output-dir "$BASE/render" --studio-style mirror-premium --step 90 --samples 8 --width 1280 --height 720
            fi
          ' > preview/render-log.txt 2>&1 || { tail -n 70 preview/render-log.txt; exit 1; }
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/render/empty_+000.png" preview/ || true
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/render/empty_-090.png" preview/ || true
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/render/empty_+090.png" preview/ || true
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/render/camera_manifest.json" preview/
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/render/scene_qa.json" preview/
          # No logo substitution: QA render is intentionally unbranded until official asset is provided.
          # Create isolated, explicitly non-publishable JAECOO 8 mirror POC.
          $SSH "$REMOTE" 'set -eu
            BASE=/tmp/carvamo-mirror-premium-preview
            CAR=/tmp/carvamo-photo-ai-test/results/v47-inpainting/rear/v51/original_car_rgba.png
            MANIFEST=/tmp/carvamo-photo-ai-test/results/v47-inpainting/rear/v51/manifest_v51.json
            test -f "$CAR" && test -f "$MANIFEST"
            /tmp/carvamo-v24-venv/bin/python "$BASE/mirror_poc_v53.py" --car "$CAR" --manifest "$MANIFEST" --background "$BASE/render/empty_+000.png" --output-dir "$BASE/poc"
          ' > preview/composite-log.txt 2>&1 || { tail -n 60 preview/composite-log.txt; exit 1; }
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/poc/jaecoo8_mirror_poc.png" preview/
          $SCP "$REMOTE:/tmp/carvamo-mirror-premium-preview/poc/mirror_poc_report.json" preview/
          printf '%s\n' 'Mirror-floor POC only: physical wheel contact and reflection perspective NOT verified' > preview/qa-status.txt
      - name: Validate Brand Book 2.0 render and publication gates
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("preview")
          scene=json.loads((root/"scene_qa.json").read_text())
          report=json.loads((root/"mirror_poc_report.json").read_text())
          for name in ("empty_+000.png","empty_-090.png","empty_+090.png","jaecoo8_mirror_poc.png"):
              p=root/name
              assert p.is_file() and p.stat().st_size>10000, "Missing image: "+name
              with p.open("rb") as stream:
                  assert stream.read(8)==bytes.fromhex("89504e470d0a1a0a"), "Invalid PNG: "+name
          assert scene.get("brand_book")=="CARVAMO Brand Book 2.0"
          assert scene.get("slogan")=="Dobra cena. Prosto od dealera."
          assert scene.get("palette",{}).get("navy")=="#102A34"
          logo=bool(scene.get("official_logo_included"))
          contact=bool(report.get("wheel_ground_contact_verified",False))
          ready=logo and contact and bool(report.get("ready_for_publication",False))
          status={"render_files_valid":True,"canonical_logo_present":logo,
                  "wheel_ground_contact_verified":contact,"ready_for_publication":ready}
          (root/"qa-status.json").write_text(json.dumps(status,indent=2))
          print(json.dumps(status,indent=2))
          PY
      - name: Publish image for iPhone viewing inside GitHub repository
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          for filename in ("jaecoo8_mirror_poc.png","empty_+000.png"):
              local=Path("preview")/filename
              if not local.is_file(): raise SystemExit("Missing preview image: "+str(local))
              path="photo-ai-preview/"+filename
              url="https://api.github.com/repos/"+repo+"/contents/"+path
              headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                       "X-GitHub-Api-Version":"2022-11-28","User-Agent":"carvamo-photo-ai-preview"}
              sha=None
              try:
                  req=urllib.request.Request(url+"?ref=main",headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as response:
                      sha=json.load(response)["sha"]
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
              payload={"message":"CARVAMO Photo AI: refresh unapproved mirror-floor QA preview",
                       "content":base64.b64encode(local.read_bytes()).decode("ascii"),"branch":"main"}
              if sha: payload["sha"]=sha
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")
              with urllib.request.urlopen(req,timeout=90) as response:
                  result=json.load(response)
              print("Preview available in GitHub:",result["content"]["html_url"])
          PY
      - name: Upload renders and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carvamo-mirror-premium-ovh-preview
          path: preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
