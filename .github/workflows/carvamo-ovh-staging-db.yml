name: CARVAMO OVH private staging database
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: ovh-staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate provisioning script
        run: bash -n tools/ovh/provision_staging_db.sh
      - name: Configure SSH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/carvamo_deploy
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/carvamo_deploy ~/.ssh/known_hosts
      - name: Provision isolated PostgreSQL on OVH
        run: |
          set -euo pipefail
          scp -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes tools/ovh/provision_staging_db.sh carvamo-deploy@146.59.52.16:carvamo-staging-db.sh
          ssh -i ~/.ssh/carvamo_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes carvamo-deploy@146.59.52.16 'bash carvamo-staging-db.sh'
