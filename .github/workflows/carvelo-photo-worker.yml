name: CARVELO AI – zdjęcia zewnętrzne i widok przez szyby
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/carvelo-photo-worker.yml'
      - 'tools/carvelo-photo-ai/**'
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: carvelo-photo-ai
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'krzysztofjozefiakipff-cpu/gregarious-horse-a1b3b9' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kontrola bezpieczeństwa maski szyb (bez modelu i bez zdjęć klientów)
        if: github.event_name == 'push'
        run: |
          python -m pip install Pillow==12.1.0 numpy==2.3.5 cairosvg==2.8.2
          python tools/carvelo-photo-ai/test_interior_windows.py
          python tools/carvelo-photo-ai/test_studio_compose.py
      - name: Pobierz zadanie za pomocą GitHub OIDC (bez kluczy Supabase)
        id: job
        run: python tools/carvelo-photo-ai/broker.py
      - name: Zainstaluj narzędzia segmentacji tylko gdy jest zdjęcie
        if: steps.job.outputs.pending == 'true'
        run: python -m pip install -r tools/carvelo-photo-ai/requirements-gh.txt
      - name: Zainstaluj PyTorch CPU tylko dla widoku przez szyby
        if: steps.job.outputs.pending == 'true' && steps.job.outputs.mode == 'showroom_windows' && steps.job.outputs.manual != 'true'
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Zainstaluj model segmentacji szyb CLIPSeg
        if: steps.job.outputs.pending == 'true' && steps.job.outputs.mode == 'showroom_windows' && steps.job.outputs.manual != 'true'
        run: python -m pip install -r tools/carvelo-photo-ai/requirements-interior.txt
      - name: Obrób zdjęcie i prześlij wersję z logo do moderacji
        if: steps.job.outputs.pending == 'true'
        run: python tools/carvelo-photo-ai/render_github.py
