name: CARVELO AI – zdjęcia zewnętrzne i widok przez szyby
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/carvelo-photo-worker.yml'
      - 'tools/carvelo-photo-ai/**'
      - 'assets/brand/carvelo-showroom-v1.webp.b64'
      - 'assets/brand/carvelo-showroom-empty-v5.webp'
      - 'assets/brand/carvelo-wordmark-on-dark.svg'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: carvelo-photo-ai
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'krzysztofjozefiakipff-cpu/gregarious-horse-a1b3b9' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      HF_HOME: /tmp/carvelo-hf
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            tools/carvelo-photo-ai/requirements-gh.txt
            tools/carvelo-photo-ai/requirements-interior.txt
      - name: Przywróć cache modelu CLIPSeg
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: /tmp/carvelo-hf
          key: carvelo-clipseg-rd64-refined-v1-${{ runner.os }}
      - name: Kontrola bezpieczeństwa maski szyb (bez modelu i bez zdjęć klientów)
        if: github.event_name == 'push'
        run: |
          python -m pip install Pillow==12.1.0 numpy==2.3.5 cairosvg==2.8.2
          python tools/carvelo-photo-ai/test_interior_windows.py
          python tools/carvelo-photo-ai/test_studio_compose.py
          python tools/carvelo-photo-ai/test_batch_runner.py
      - name: Pobierz zadanie za pomocą GitHub OIDC (bez kluczy Supabase)
        id: job
        run: python tools/carvelo-photo-ai/broker.py
      - name: Postęp 16% — przygotowanie środowiska zdjęcia
        if: steps.job.outputs.pending == 'true'
        run: python tools/carvelo-photo-ai/progress.py 16 installing
      - name: Zainstaluj narzędzia segmentacji tylko gdy jest zdjęcie
        if: steps.job.outputs.pending == 'true'
        run: python -m pip install -r tools/carvelo-photo-ai/requirements-gh.txt
      - name: Postęp 30% — pakiety podstawowe zainstalowane
        if: steps.job.outputs.pending == 'true'
        run: python tools/carvelo-photo-ai/progress.py 30 preparing
      - name: Postęp 36% — pobieranie modelu segmentacji szyb
        if: steps.job.outputs.pending == 'true' && steps.job.outputs.mode == 'showroom_windows' && steps.job.outputs.manual != 'true'
        run: python tools/carvelo-photo-ai/progress.py 36 loading_model
      - name: Zainstaluj PyTorch CPU tylko dla widoku przez szyby
        if: steps.job.outputs.pending == 'true' && steps.job.outputs.mode == 'showroom_windows' && steps.job.outputs.manual != 'true'
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Zainstaluj model segmentacji szyb CLIPSeg
        if: steps.job.outputs.pending == 'true' && steps.job.outputs.mode == 'showroom_windows' && steps.job.outputs.manual != 'true'
        run: python -m pip install -r tools/carvelo-photo-ai/requirements-interior.txt
      - name: Postęp 42% — środowisko gotowe
        if: steps.job.outputs.pending == 'true'
        run: python tools/carvelo-photo-ai/progress.py 42 preparing
      - name: Obrób pierwsze zdjęcie i prześlij wersję do moderacji
        if: steps.job.outputs.pending == 'true'
        run: python tools/carvelo-photo-ai/render_github.py
      - name: Opróżniaj kolejkę partiami (ponowne użycie modeli AI)
        if: steps.job.outputs.pending == 'true'
        env:
          CARVELO_BATCH_MAX_EXTRA: '8'
          CARVELO_BATCH_MAX_SECONDS: '720'
        run: python tools/carvelo-photo-ai/batch_runner.py

