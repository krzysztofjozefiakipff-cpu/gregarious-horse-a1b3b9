<header class="panel-header account-header">
  <div class="account-header-inner">
    <div class="account-brand">
      <span class="product-brand"><span class="product-mark" aria-hidden="true"></span><span class="product-wordmark">biegwyzej.pl</span></span>
    </div>
    <img class="dealer-logo" id="account-dealer-logo" alt="" hidden>
    <div class="account-controls" id="account-controls" hidden>
      <button type="button" id="communication-open" aria-label="Wiadomości i powiadomienia" aria-haspopup="dialog" hidden>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
        <span id="communication-count" hidden></span>
      </button>
      <details id="account-menu">
        <summary aria-label="Konto" title="Konto">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.25"/><path d="M5 20v-1a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v1"/></svg>
        </summary>
        <div class="account-menu-content">
          <strong id="account-greeting"></strong>
          <p id="account-current-role"></p>
          <label id="account-role-field" for="account-role" hidden>Aktywna rola
            <select id="account-role"></select>
          </label>
          <button type="button" id="account-tools-open" aria-haspopup="dialog">Narzędzia</button>
          <button type="button" id="department-menu-open" hidden>Zespół działu</button>
          <form class="panel-signout" method="post" action="/logout">
            <button type="submit">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5m3-8h9m-4-4 4 4-4 4"/></svg>
              Wyloguj się
            </button>
          </form>
        </div>
      </details>
    </div>
  </div>
</header>

<dialog id="communication-dialog" aria-labelledby="communication-title">
  <header>
    <h2 id="communication-title">Wiadomości i powiadomienia</h2>
    <form method="dialog"><button type="submit" aria-label="Zamknij">×</button></form>
  </header>
  <p id="communication-status" role="status"></p>
  <div id="communication-inbox">
    <button type="button" id="communication-refresh" class="secondary">Odśwież</button>
    <details id="communication-events" hidden>
      <summary>Powiadomienia systemowe</summary>
      <ul id="communication-event-list"></ul>
    </details>
    <ul id="communication-list"></ul>
    <details id="communication-compose">
      <summary>Nowa wiadomość</summary>
      <form id="communication-send">
        <label>Odbiorca <select name="destination" required></select></label>
        <label>Temat <input name="title" maxlength="100" required></label>
        <label>Wiadomość <textarea name="message" maxlength="4000" rows="4" required></textarea></label>
        <button>Wyślij</button>
      </form>
    </details>
  </div>
  <section id="communication-thread" hidden>
    <button type="button" id="communication-back" class="secondary">Wróć do skrzynki</button>
    <h3 id="communication-subject"></h3>
    <button type="button" id="communication-older" class="secondary" hidden>Starsze wiadomości</button>
    <ol id="communication-messages"></ol>
    <form id="communication-reply">
      <label>Odpowiedź <textarea name="message" maxlength="4000" rows="3" required></textarea></label>
      <button>Wyślij odpowiedź</button>
    </form>
  </section>
</dialog>
<dialog id="department-settings" aria-labelledby="department-settings-title">
  <header><h2 id="department-settings-title">Działy grupy</h2>
    <form method="dialog"><button type="submit" aria-label="Zamknij">×</button></form>
  </header>
  <p id="department-settings-status" role="status"></p>
  <div id="department-settings-forms"></div>
</dialog>
<style>
#communication-open { position:relative; display:grid; place-items:center; width:44px; height:44px; padding:0; color:white; border:1px solid #ffffff72; border-radius:12px; background:transparent; }
#communication-open[hidden] { display:none; }
#communication-count { position:absolute; inset-block-start:-5px; inset-inline-end:-4px; border-radius:12px; padding:2px 4px; font-size:.7rem; color:var(--panel-ink); background:var(--panel-orange); }
:is(#communication-dialog,#department-settings) { width:min(36rem,calc(100% - 1.5rem)); max-height:86dvh; overflow:auto; padding:1rem; border:1px solid var(--panel-border); border-radius:16px; color:var(--panel-ink); }
:is(#communication-dialog,#department-settings)::backdrop { background:#24152299; }
:is(#communication-dialog,#department-settings) header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 0 8px; }
#communication-dialog h2 { font-size:1.15rem; margin:0; }
#communication-dialog button { min-height:44px; }
#communication-dialog ul, #communication-dialog ol { display:grid; gap:8px; list-style:none; padding:0; }
#communication-list button { width:100%; text-align:start; overflow-wrap:anywhere; }
#communication-messages li { padding:10px; border-radius:10px; background:var(--panel-lilac); }
#communication-messages li[data-own="true"] { background:var(--highlight); }
#communication-messages p { white-space:pre-wrap; overflow-wrap:anywhere; margin:4px 0 0; }
#communication-dialog details { margin:10px 0; padding:8px; border:1px solid var(--panel-border); border-radius:10px; }
#communication-dialog summary { cursor:pointer; font-weight:700; }
:is(#communication-dialog,#department-settings) form:not([method="dialog"]), :is(#communication-dialog,#department-settings) label { display:grid; gap:6px; min-width:0; }
#communication-dialog form:not([method="dialog"]) { margin-top:8px; }
#communication-dialog :is(input,select,textarea) { width:100%; min-width:0; font:inherit; }
</style>

<button type="button" id="fox-assistant-open" aria-label="Otwórz asystenta Lisek" title="Zapytaj Liska" hidden><!-- FOX_MASCOT --></button>

<dialog id="fox-assistant" aria-labelledby="fox-assistant-title">
  <header>
    <h2 id="fox-assistant-title"><!-- FOX_MASCOT --> Zapytaj Liska</h2>
    <form method="dialog"><button type="submit" autofocus aria-label="Zamknij asystenta">×</button></form>
  </header>
  <div id="fox-assistant-messages" role="log" aria-label="Pytania i odpowiedzi"></div>
  <small>Głos Liska jest generowany przez AI.</small>
  <p id="fox-assistant-status" role="status" hidden></p>
  <form id="fox-assistant-form">
    <label for="fox-assistant-question">Twoje pytanie</label>
    <textarea id="fox-assistant-question" rows="2" maxlength="500" required placeholder="W czym Lisek może pomóc?"></textarea>
    <div class="fox-assistant-actions">
      <button type="button" id="fox-assistant-mic">🎙️ Zadaj głosowo</button>
      <button type="submit">Wyślij pytanie</button>
    </div>
  </form>
</dialog>
<style>
  #fox-assistant-open {
    position:fixed; z-index:6; inset-inline-end:max(12px,env(safe-area-inset-right));
    inset-block-end:calc(12px + env(safe-area-inset-bottom));
    width:clamp(60px,17vw,76px); aspect-ratio:1; padding:0; border-radius:12px;
    border:0; background:transparent; box-shadow:none;
    cursor:pointer; touch-action:manipulation;
  }
  body:has(.persistent-panel-nav:not([hidden])) #fox-assistant-open { inset-block-end:calc(76px + env(safe-area-inset-bottom)); }
  @media(max-width:850px) {
    body:has(.mobile-panel-nav:not([hidden]), #daily:not([hidden]) .seller-nav:not([hidden])) #fox-assistant-open { inset-block-end:calc(76px + env(safe-area-inset-bottom)); }
  }
  #fox-assistant-open:focus-visible { outline:2px solid #693768; outline-offset:2px; }
  .fox-mascot { position:relative; display:block; width:100%; height:100%; transform-origin:center 93%; }
  .fox-mascot img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .fox-tail-layer {
    clip-path:polygon(67% 50%,100% 50%,100% 100%,52% 100%,53% 94%,57% 89%,59% 83%,57% 72%,56% 65%,59% 57%);
    transform-origin:60% 88%;
  }
  .fox-paw-layer {
    clip-path:polygon(0 45%,21% 45%,27% 52%,28% 58%,30% 66%,27% 73%,0 73%);
    transform-origin:28% 67%;
  }
  .fox-body-layer {
    clip-path:polygon(0 0,100% 0,100% 50%,68% 50%,60% 58%,57% 65%,58% 72%,60% 83%,58% 90%,54% 95%,53% 100%,0 100%,0 73%,27% 73%,30% 66%,28% 58%,27% 52%,21% 45%,0 45%);
  }
  #fox-assistant-title .fox-mascot { width:56px; height:56px; flex:0 0 56px; }
  #fox-assistant-open .fox-tail-layer { animation:fox-tail-wag 1.8s ease-in-out infinite; }
  #fox-assistant-open .fox-paw-layer { animation:fox-paw-wave 9s ease-in-out infinite; }
  #fox-assistant[data-activity="listening"] .fox-mascot { animation:fox-nod 1.4s ease-in-out infinite; }
  #fox-assistant[data-activity="thinking"] .fox-tail-layer { animation:fox-tail-wag .85s ease-in-out infinite; }
  @keyframes fox-tail-wag { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(7deg); } }
  @keyframes fox-paw-wave { 0%,83%,100% { transform:rotate(0); } 87%,95% { transform:rotate(12deg); } 91% { transform:rotate(-8deg); } }
  @keyframes fox-nod { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-8deg) translateY(-2px); } }
  @media(prefers-reduced-motion:reduce) {
    .fox-mascot, .fox-mascot * { animation:none !important; }
  }
  #fox-assistant { box-sizing: border-box; width: min(34rem, calc(100% - 2rem)); max-height: 85dvh; overflow: auto; border: 1px solid #e4dbe5; border-radius: 16px; padding: 1rem; color: #302033; background: #fff; }
  #fox-assistant::backdrop { background: #26132888; }
  #fox-assistant header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  #fox-assistant h2 { display: flex; align-items: center; gap: .65rem; margin: 0; font-size: 1.15rem; }
  #fox-assistant button { min-height: 44px; border-radius: 8px; }
  #fox-assistant header button { min-width: 44px; font-size: 1.2rem; }
  #fox-assistant-messages { max-height: 36dvh; overflow: auto; overflow-wrap: anywhere; }
  #fox-assistant-messages p { margin: .6rem 0; padding: .65rem; border-radius: 8px; background: #f5eef6; white-space: pre-wrap; }
  #fox-assistant-messages p[data-speaker="Ty"] { background: #fff1e5; }
  #fox-assistant-form { display: grid; gap: .45rem; margin-top: .75rem; }
  .fox-assistant-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  #fox-assistant-messages button { display: block; margin-top: .5rem; }
  #fox-assistant-question { box-sizing: border-box; width: 100%; font-size: 1rem; }
</style>

<template id="department-new-user">
  <form>
    <h4>Dodaj użytkownika</h4>
    <p>Rola · <strong data-department-role></strong></p>
    <label>Imię <input name="firstName" autocomplete="given-name" required maxlength="60"></label>
    <label>Nazwisko <input name="lastName" autocomplete="family-name" required maxlength="60"></label>
    <label>E-mail <input name="email" type="email" autocomplete="email" required maxlength="120"></label>
    <label>Numer telefonu <input name="phone" type="tel" autocomplete="tel" required maxlength="32"></label>
    <label>Hasło (opcjonalnie, co najmniej 8 znaków) <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
    <button>Dodaj użytkownika</button>
  </form>
</template>

<dialog id="account-tools-dialog" aria-labelledby="account-tools-title">
  <form method="dialog"><button>Zamknij</button></form>
  <h2 id="account-tools-title">Narzędzia</h2>
  <!-- CALCULATORS -->
</dialog>
