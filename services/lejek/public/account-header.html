<header class="panel-header account-header">
  <div class="account-header-inner">
    <div class="account-brand">
      <span class="product-brand"><span class="product-mark" aria-hidden="true"></span><span class="product-wordmark">biegwyzej.pl</span></span>
      <img class="dealer-logo" id="account-dealer-logo" alt="" hidden>
    </div>
    <div class="account-controls" id="account-controls" hidden>
      <strong id="account-greeting"></strong>
      <select id="account-role" aria-label="Zmień rolę" hidden></select>
      <form class="panel-signout" method="post" action="/logout">
        <button type="submit" aria-label="Wyloguj się" title="Wyloguj się">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5m3-8h9m-4-4 4 4-4 4"/></svg>
        </button>
      </form>
    </div>
  </div>
</header>
