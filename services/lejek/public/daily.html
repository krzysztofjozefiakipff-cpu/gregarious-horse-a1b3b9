<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mój dzień · OMODA i JAECOO</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#202b25;font:16px/1.5 system-ui,sans-serif}header{background:#23392f;color:#fff}nav,main{max-width:870px;margin:auto;padding:16px 22px}nav{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:700}h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1;margin:16px 0 8px;letter-spacing:-.06em}h2{font-size:1.2rem;margin:0 0 12px}p{margin:0}blockquote{margin:12px 0 20px;color:#44594e;font-family:Georgia,serif;font-size:1.2rem}section,form,details{background:#fff;border:1px solid #dddeda;border-radius:16px;padding:16px;margin-bottom:12px}.actions{background:#e1ebdf;border-color:#d3e0d2}.actions ul{margin:0;padding-left:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cards section{padding:13px}.cards strong{display:block;font-size:1.45rem}.hint,small{color:#49564e}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #e6e9e5}th:nth-child(2),td:nth-child(2){text-align:center}th:last-child,td:last-child{text-align:right}input{border:1px solid #a0afa5;border-radius:7px;padding:7px;width:76px;min-height:42px;font:inherit}input[type=date]{width:auto}.heading,.save{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.save{margin-top:12px}button{background:#284d3a;color:white;border:0;border-radius:9px;font:inherit;font-weight:700;padding:11px 20px;cursor:pointer}.behind{color:#a02429}.ahead{color:#216741}details label{display:flex;gap:12px;align-items:center;margin:10px 0}summary{cursor:pointer}@media(max-width:490px){nav,main{padding-inline:12px}.cards{gap:5px}.cards section{padding:8px;font-size:.84rem}.cards strong{font-size:1.2rem}th,td{font-size:.88rem}form,section{padding:12px}}

<header><nav><span>OMODA i JAECOO</span><span><a id="panel" href="/" style="color:white">Panel salonu</a></span></nav></header>

</div><form method="post" action="/logout"><button>Wyloguj się</button></form></main><script src="workbook-plan.js"></script><script src="daily.js"></script></body></html>
