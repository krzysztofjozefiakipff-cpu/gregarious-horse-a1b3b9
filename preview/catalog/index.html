<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Katalog pojazdów | CARVAMO</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#102a34;background:#f1f6f5}*{box-sizing:border-box}body{margin:0}header{background:#102a34;padding:18px max(20px,calc((100% - 1120px)/2));color:white}header img{width:180px;background:white;border-radius:6px;padding:5px}main{max-width:1000px;margin:32px auto;padding:0 18px}.card{background:white;border:1px solid #d9e5e3;border-radius:16px;padding:25px;margin:18px 0}h1{font-size:30px}.muted{color:#60747a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-weight:650;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #b9cdcb;border-radius:8px;font:inherit}button{background:#008f83;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e2ecea;padding:10px}a{color:#006b62}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="../assets/carvamo-wordmark.svg" alt="CARVAMO"></header><main><p><a href="../accounts/">← Panel CARVAMO</a></p><h1>Centralny katalog pojazdów</h1><p class="muted">Oddzielny moduł administracyjny. Dostęp wyłącznie dla administratorów i pracowników CARVAMO.</p><section id="loginBox" class="card"><h2>Logowanie zespołu CARVAMO</h2><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required><p><button>Zaloguj</button></p></form></section><div id="workspace" hidden><section class="card"><h2>Dodaj pozycję do katalogu</h2><form id="catalogForm"><div class="grid"><div><label for="brand">Marka</label><input id="brand" list="brands" required maxlength="100"><datalist id="brands"></datalist></div><div><label for="model">Model</label><input id="model" list="models" required maxlength="100"><datalist id="models"></datalist></div><div><label for="trim">Wersja (opcjonalnie)</label><input id="trim" maxlength="120"></div></div><p><button>Dodaj do katalogu</button></p></form></section><section class="card"><h2>Pozycje katalogowe</h2><label for="search">Wyszukaj markę, model lub wersję</label><input id="search" type="search" placeholder="Wpisz pierwsze litery"><p id="count" class="muted"></p><div style="overflow-x:auto"><table><thead><tr><th>Marka</th><th>Model</th><th>Wersja</th></tr></thead><tbody id="rows"></tbody></table></div></section><button type="button" id="logout">Wyloguj</button></div><p id="message" role="status"></p></main><script src="./catalog.js?v=1"></script></body></html>
