<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARVAMO — szczegóły oferty</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#102a34;background:#f1f6f5}body{margin:0}header{background:#102a34;padding:18px 5%}header img{width:190px;background:#fff;border-radius:7px;padding:6px}main{max-width:960px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #d9e5e3;border-radius:16px;padding:26px;margin:18px 0}h1{font-size:30px}h2{font-size:19px;color:#006b62}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{border-bottom:1px solid #e4eeec;padding:10px 0}.field small{display:block;color:#587177;margin-bottom:5px}.download{display:inline-block;padding:13px 19px;border-radius:9px;background:#006b62;color:white;text-decoration:none;font-weight:700}li{margin:9px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="../assets/carvamo-wordmark.svg" alt="CARVAMO"></header><main><h1 id="heading">Specyfikacja samochodu</h1><p id="status" role="status">Ładowanie oferty…</p><div id="content" hidden><section class="card"><h2>Samochód</h2><div class="grid" id="vehicle"></div></section><section class="card"><h2>Silnik i napęd</h2><div class="grid" id="technical"></div></section><section class="card"><h2>Cena i warunki</h2><div id="price"></div></section><section class="card"><h2>Wyposażenie standardowe</h2><ul id="standard"></ul></section><section class="card"><h2>Wyposażenie dodatkowe</h2><ul id="optional"></ul></section><section class="card"><h2>Pozostałe informacje</h2><div id="other"></div></section><p><a id="download" class="download" href="#">Pobierz ofertę ze specyfikacją (PDF)</a></p></div></main><script>const id=new URLSearchParams(location.search).get("id"),$=x=>document.getElementById(x);function field(target,label,value){if(value===null||value===undefined||String(value).trim()==="")return;const wrap=document.createElement("div");wrap.className="field";const name=document.createElement("small");name.textContent=label;const content=document.createElement("strong");content.textContent=String(value);wrap.append(name,content);$(target).appendChild(wrap)}function items(target,values){if(!values?.length){const li=document.createElement("li");li.textContent="Brak potwierdzonych danych.";$(target).appendChild(li);return}for(const value of values){const li=document.createElement("li");li.textContent=String(value);$(target).appendChild(li)}}(async()=>{if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error("Nieprawidłowy adres oferty");const r=await fetch("/api/public/offers/"+encodeURIComponent(id),{cache:"no-store"});if(!r.ok)throw Error("Oferta nie jest dostępna");const o=(await r.json()).offer;$("heading").textContent=o.brand+" "+o.model;for(const [label,key] of [["Marka","brand"],["Model","model"],["Wersja","trim_name"],["Nadwozie","body"],["Dealer","dealer_name"]])field("vehicle",label,o[key]);for(const [label,key] of [["Silnik","engine_name"],["Moc (KM)","power_hp"],["Paliwo","fuel"],["Napęd","drive_type"],["Skrzynia biegów","transmission_type"]])field("technical",label,o[key]);field("price","Cena brutto",Number(o.gross_price).toLocaleString("pl-PL")+" zł");items("standard",o.standard_equipment);items("optional",o.optional_equipment);for(const [key,value] of Object.entries(o.other_details||{}))field("other",key,value);$("download").href="/api/public/offers/"+encodeURIComponent(id)+"/pdf";$("content").hidden=false;$("status").textContent="Specyfikacja według standardu CARVAMO."})().catch(e=>{$("status").textContent=e.message});</script></body></html>
